services:

  # ========================
  # 🟢 POSTGRES
  # ========================
  postgres:
    container_name: postgres
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # ← pas de ports exposés en prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ========================
  # 🟡 KAFKA
  # ========================
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    hostname: kafka
    # ← pas de ports exposés en prod
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CLUSTER_ID: q1Sh-9_ISia_zwGINzRvyQ
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - my_network
    restart: always

  # ← MAILHOG SUPPRIMÉ — remplacé par vrai SMTP

  # ========================
  # 🔵 EUREKA
  # ========================
  eureka-registry:
    container_name: eureka-registry
    image: smartiadev/eureka-registry:latest
    # ← pas de ports exposés en prod
    networks:
      - my_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  # ========================
  # ⚙️ CONFIG SERVER
  # ========================
  configuration-service:
    container_name: configuration-service
    image: smartiadev/configuration-service:latest
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-registry:8761/eureka/
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - SPRING_CONFIG_IMPORT=optional:file:./
      - SPRING_APPLICATION_NAME=configuration-service
    depends_on:
      eureka-registry:
        condition: service_healthy
    networks:
      - my_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s
    restart: always

  # ========================
  # 🚪 API GATEWAY
  # ========================
  api-gateway:
    container_name: api-gateway
    image: smartiadev/api-gateway:latest
    ports:
      - "8080:8080"  # ← seul port exposé, Coolify proxy ici
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - eureka.client.service-url.defaultZone=http://eureka-registry:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuration-service:8888
      - SPRING_CODEC_MAX_IN_MEMORY_SIZE=52428800
      - TZ=America/Toronto
      - JAVA_TOOL_OPTIONS=-Duser.timezone=America/Toronto
    depends_on:
      eureka-registry:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
    labels:
      - "coolify.expose=true"  # ← Coolify expose ce service via son proxy
    networks:
      - my_network
    restart: always

  # ========================
  # 🔐 AUTH SERVICE
  # ========================
  auth-service:
    container_name: auth-service
    image: smartiadev/auth-service:latest
    environment:
      - SERVER_PORT=8081
      - TZ=America/Toronto
      - JAVA_TOOL_OPTIONS=-Duser.timezone=America/Toronto
      - SPRING_MAIL_HOST=${MAIL_HOST}
      - SPRING_MAIL_PORT=${MAIL_PORT}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=auth_schema
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION=true
      - SPRING_SQL_INIT_MODE=never
      - SPRING_DATASOURCE_INITIALIZATION_MODE=never
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=86400000
      - eureka.client.service-url.defaultZone=http://eureka-registry:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuration-service:8888/
    depends_on:
      postgres:
        condition: service_healthy
      eureka-registry:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - my_network
    restart: always

  # ========================
  # 🧾 AUCTION SERVICE
  # ========================
  auction-service:
    container_name: auction-service
    image: smartiadev/auction-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/Toronto
      - JAVA_TOOL_OPTIONS=-Duser.timezone=America/Toronto
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - eureka.client.service-url.defaultZone=http://eureka-registry:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuration-service:8888
    depends_on:
      postgres:
        condition: service_healthy
      eureka-registry:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - my_network
    restart: always

  # ========================
  # 📦 ITEM SERVICE
  # ========================
  item-service:
    container_name: item-service
    image: smartiadev/item-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/Toronto
      - JAVA_TOOL_OPTIONS=-Duser.timezone=America/Toronto
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_DIR=/app/uploads/
      - eureka.client.service-url.defaultZone=http://eureka-registry:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuration-service:8888
    volumes:
      - item_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      eureka-registry:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - my_network
    restart: always

  # ========================
  # 💳 PAYMENTS SERVICE
  # ========================
  payments-service:
    container_name: payments-service
    image: smartiadev/payments-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/Toronto
      - JAVA_TOOL_OPTIONS=-Duser.timezone=America/Toronto
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - eureka.client.service-url.defaultZone=http://eureka-registry:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuration-service:8888
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-registry:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - my_network
    restart: always

  # ========================
  # 🔔 NOTIF SERVICE
  # ========================
  notif-service:
    container_name: notif-service
    image: smartiadev/notif-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/Toronto
      - JAVA_TOOL_OPTIONS=-Duser.timezone=America/Toronto
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_MAIL_HOST=${MAIL_HOST}
      - SPRING_MAIL_PORT=${MAIL_PORT}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=true
      - eureka.client.service-url.defaultZone=http://eureka-registry:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuration-service:8888
    depends_on:
      postgres:
        condition: service_healthy
      eureka-registry:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - my_network
    restart: always

  # ========================
  # ⚖️ DISPUTE SERVICE
  # ========================
  dispute-service:
    container_name: dispute-service
    image: smartiadev/dispute-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/Toronto
      - JAVA_TOOL_OPTIONS=-Duser.timezone=America/Toronto
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - eureka.client.service-url.defaultZone=http://eureka-registry:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuration-service:8888
    depends_on:
      postgres:
        condition: service_healthy
      eureka-registry:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - my_network
    restart: always

  # ========================
  # 🏠 RENTAL SERVICE
  # ========================
  rental-service:
    container_name: rental-service
    image: smartiadev/rental-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=rental_schema
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=false
      - TZ=America/Toronto
      - JAVA_TOOL_OPTIONS=-Duser.timezone=America/Toronto
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - eureka.client.service-url.defaultZone=http://eureka-registry:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuration-service:8888
    depends_on:
      postgres:
        condition: service_healthy
      eureka-registry:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - my_network
    restart: always

  # ========================
  # ⭐ REVIEW SERVICE
  # ========================
  review-service:
    container_name: review-service
    image: smartiadev/review-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/Toronto
      - JAVA_TOOL_OPTIONS=-Duser.timezone=America/Toronto
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - eureka.client.service-url.defaultZone=http://eureka-registry:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuration-service:8888
    depends_on:
      postgres:
        condition: service_healthy
      eureka-registry:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - my_network
    restart: always

  # ========================
  # 📋 SUBSCRIPTION SERVICE
  # ========================
  subscription-service:
    container_name: subscription-service
    image: smartiadev/subscription-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=America/Toronto
      - JAVA_TOOL_OPTIONS=-Duser.timezone=America/Toronto
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - eureka.client.service-url.defaultZone=http://eureka-registry:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuration-service:8888
    depends_on:
      postgres:
        condition: service_healthy
      eureka-registry:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - my_network
    restart: always

  # ========================
  # 💬 MESSAGING SERVICE
  # ========================
  messaging-service:
    container_name: messaging-service
    image: smartiadev/messaging-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - UPLOAD_DIR_MESSAGES=/app/uploads/messages/
      - TZ=America/Toronto
      - JAVA_TOOL_OPTIONS=-Duser.timezone=America/Toronto
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - eureka.client.service-url.defaultZone=http://eureka-registry:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configuration-service:8888
    volumes:
      - message_uploads:/app/uploads/messages
    depends_on:
      postgres:
        condition: service_healthy
      eureka-registry:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - my_network
    restart: always
  # ── Frontend Web ──────────────────────────────────────
  renthub-web:
    container_name: renthub-web
    image: smartiadev/renthub-web:latest
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://api.gonifty.ca
    labels:
      - "coolify.expose=true"
    networks:
      - my_network


volumes:
  kafka_data:
  postgres_data:
  item_uploads:
  message_uploads:   # ← volume séparé pour les messages

networks:
  my_network:
    driver: bridge